<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Fixer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a2035; }
  h1 { font-size: 22px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input[type=text] { width: 100%; padding: 10px; border: 1.5px solid #ccd; border-radius: 8px; font-size: 13px; }
  button { margin-top: 18px; padding: 12px 24px; background: #1e3a6e; color: #fff; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
  #log { margin-top: 20px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  .ok { color: #1a8c5e; } .warn { color: #b07800; } .err { color: #d63b3b; }
</style>
</head>
<body>
<h1>Admission Portal Fixer</h1>
<p>Choose your portal HTML file. This tool applies the new API URL and all fixes, then downloads the corrected file. Nothing is uploaded anywhere; it all runs in your browser.</p>

<label for="url">Apps Script /exec URL</label>
<input type="text" id="url" value="https://script.google.com/macros/s/AKfycbx2wTEsc3nrEOD5a1-36Wqh9VqDvJkSrTIg7Di_bBgrgvtztjWKdnF5xqRnJQX4r1n0AA/exec">

<label for="file">Your portal HTML file</label>
<input type="file" id="file" accept=".html,.htm">

<button id="go">Fix and download</button>
<div id="log"></div>

<script type="text/plain" id="perfBlock">
// HS-PERF-v2 — optimized data layer, filtering, paginated rendering, fast sidebar
(function () {
  var st = document.createElement("style");
  st.textContent =
    ".data-table td,.data-table tbody tr{transition:none!important}" +
    ".pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--text-muted)}" +
    ".pager-btns{display:flex;align-items:center;gap:8px}" +
    ".pager button{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}" +
    ".pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}" +
    ".pager button:disabled{opacity:.4;cursor:not-allowed}" +
    ".pager select{padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;background:var(--surface)}";
  document.head.appendChild(st);
  try { localStorage.removeItem("hs_cache_v3"); } catch (e) {}

  // Every POST to Apps Script gets a 45 s timeout so the UI can never hang forever
  var origFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    opts = opts || {};
    if (!opts.signal && opts.method === "POST" && typeof url === "string" && url.indexOf("script.google.com") > -1) {
      var c = new AbortController();
      var t = setTimeout(function () { c.abort(); }, 45000);
      return origFetch(url, Object.assign({}, opts, { signal: c.signal })).finally(function () { clearTimeout(t); });
    }
    return origFetch(url, opts);
  };
})();

// ════════════════════════════════════════════════════════════
//  DATA LAYER — versioned cache: memory → localStorage → network
// ════════════════════════════════════════════════════════════
const CACHE_TTL = 180000;               // 3 min in memory
const LS_KEY    = "hs_cache_v4";
const LS_TTL    = 24 * 60 * 60 * 1000;  // 24 h (always revalidated in the background)

let _mem = null;          // { data:[], ver:"", ts:number }
let _inflight = null;     // one shared in-flight request
let _forceFresh = false;
let _lastSync = 0;

function _lsGet() {
  try {
    const r = localStorage.getItem(LS_KEY);
    if (!r) return null;
    const p = JSON.parse(r);
    if (p && Array.isArray(p.data) && Date.now() - p.ts < LS_TTL) return p.data;
    localStorage.removeItem(LS_KEY);
  } catch (e) {}
  return null;
}
function _lsVer() { try { return localStorage.getItem(LS_KEY + "_ver") || ""; } catch (e) { return ""; } }
let _lsTimer = null;
function _lsSet(mem) {                  // debounced so big JSON writes never block the UI
  clearTimeout(_lsTimer);
  _lsTimer = setTimeout(function () {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ ts: Date.now(), data: mem.data }));
      localStorage.setItem(LS_KEY + "_ver", mem.ver || "");
    } catch (e) { try { localStorage.removeItem(LS_KEY); } catch (x) {} }
  }, 300);
}
function _lsBust() { try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_KEY + "_ver"); } catch (e) {} }

async function _fetchRaw(ms, ver) {
  const ctrl = new AbortController(), tid = setTimeout(() => ctrl.abort(), ms);
  try {
    let url = API_URL + "?action=fetch&nc=" + Date.now();
    if (_forceFresh) url += "&fresh=1"; else if (ver) url += "&v=" + encodeURIComponent(ver);
    const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = JSON.parse(await res.text());
    if (j.status === "success") {
      if (j.unchanged) return { unchanged: true, ver: j.ver };
      if (Array.isArray(j.data)) return { data: j.data, ver: j.ver || "" };
    }
    throw new Error(j.message || "Bad server response");
  } finally { clearTimeout(tid); }
}

// Returns { data, changed } or null. Shared across all callers.
async function _refresh() {
  if (_inflight) return _inflight;
  _inflight = (async () => {
    const known = (_mem && _mem.ver) || (_mem ? _lsVer() : "");
    for (let i = 0; i < 3; i++) {
      try {
        const r = await _fetchRaw([15000, 20000, 25000][i], known);
        _forceFresh = false; _lastSync = Date.now();
        if (r.unchanged && _mem) { _mem.ts = Date.now(); _mem.ver = r.ver || _mem.ver; return { data: _mem.data, changed: false }; }
        if (!r.data) continue;
        _mem = { data: r.data, ver: r.ver, ts: Date.now() };
        _lsSet(_mem);
        return { data: r.data, changed: true };
      } catch (e) {
        console.warn("[HS] fetch", i + 1, "/3 failed:", e.message);
        const n = document.getElementById("dashLoadingNote");
        if (i < 2 && n) n.textContent = "Server is slow to respond — retrying (" + (i + 2) + "/3)…";
        if (i < 2) await new Promise(r => setTimeout(r, [1200, 3000][i]));
      }
    }
    return null;
  })().finally(() => { _inflight = null; });
  return _inflight;
}
async function _fetchFresh() { const r = await _refresh(); return r ? r.data : null; }

async function _get() {
  if (_mem && Date.now() - _mem.ts < CACHE_TTL) {
    if (Date.now() - _mem.ts > 45000) _refresh();
    return _mem.data;
  }
  const ls = _lsGet();
  if (ls) { if (!_mem) _mem = { data: ls, ver: _lsVer(), ts: Date.now() }; _refresh(); return ls; }
  return await _fetchFresh();
}
function _bustAll() { _mem = null; _lsBust(); }

// compat names used by the form code
function _fetchAndCache() {
  return _refresh().then(r => { if (r && r.changed) _syncViews(r.data); return r ? r.data : null; });
}
function _bustLS() { if (_mem) _mem.ts = 0; }
function _syncViews(data) {
  const wrap = document.getElementById("sidebarManagerSummary"), skel = document.getElementById("sidebarLoading");
  if (skel) skel.style.display = "none";
  if (wrap) renderSidebarManager(data, wrap);
  if (dashboardCard.style.display !== "none") _applyDash(data);
}
window.addEventListener("online", () => { _refresh().then(r => { if (r && r.changed) _syncViews(r.data); }); });

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
const MONTHS_ABBR = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
const _MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const _lc = v => (v == null ? "" : String(v)).trim().toLowerCase();
function _esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normDateStr(raw) {
  if (!raw) return "";
  raw = raw.toString().trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.substring(0, 10);
  let m = raw.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
  if (m) return m[3] + "-" + (MONTHS_ABBR[m[2].toLowerCase()] || "00") + "-" + m[1].padStart(2, "0");
  m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  const d = new Date(raw);
  if (!isNaN(d)) return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  return "";
}
function localDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const _dateCache = new WeakMap();       // each row's date is parsed only once
function _rowDate(r) {
  let d = _dateCache.get(r);
  if (d === undefined) { d = normDateStr(r["Admission Done date"]); _dateCache.set(r, d); }
  return d;
}

// ════════════════════════════════════════════════════════════
//  SIDEBAR
// ════════════════════════════════════════════════════════════
async function loadSidebar() {
  const wrap = document.getElementById("sidebarManagerSummary");
  const skel = document.getElementById("sidebarLoading");
  if (!wrap) return;
  const instant = (_mem && _mem.data) || _lsGet();
  if (instant && instant.length) {
    if (!_mem) _mem = { data: instant, ver: _lsVer(), ts: Date.now() };
    if (skel) skel.style.display = "none";
    renderSidebarManager(instant, wrap);
    if (!_mem.ver || Date.now() - _mem.ts > 30000) {
      _refresh().then(r => { if (r && r.changed) renderSidebarManager(r.data, wrap); });
    }
    return;
  }
  if (skel) skel.style.display = "";
  wrap.innerHTML = "";
  const data = await _get();
  if (skel) skel.style.display = "none";
  if (data && data.length) { renderSidebarManager(data, wrap); }
  else if (data)           { wrap.innerHTML = '<div class="sidebar-empty">No entries yet today.</div>'; }
  else                     { _showSidebarError(wrap); }
}
function _showSidebarError(wrap) {
  wrap.innerHTML = '<div class="sidebar-error">' +
    '<div class="sidebar-error-icon">🔌</div><div class="sidebar-error-msg">Connection failed</div>' +
    '<div class="sidebar-error-sub">Could not reach Google Apps Script. Check internet and retry.</div>' +
    '<button class="sidebar-retry-btn" onclick="retrySidebar(this)">Retry</button></div>';
}
async function retrySidebar(btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-width:2px;margin-right:6px;"></span>Retrying…';
  _bustAll(); await loadSidebar();
}

function renderSidebarManager(entries, container) {
  const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const todayStr = localDateStr(now), yStr = localDateStr(y);
  const timeStr = now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
  const todayE = [], yestE = [];
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i], d = _rowDate(e);
    if (d === todayStr) todayE.push(e); else if (d === yStr) yestE.push(e);
  }
  const colors = ["#1e3a6e","#1a8c5e","#c05621","#9b2c2c","#553c9a","#2b6cb0","#744210","#0e9f8e"];
  const initials = n => n.split(" ").map(w => w[0]).join("").toUpperCase().substring(0, 2);
  function cards(list) {
    const map = {};
    list.forEach(e => {
      const m = (e["Manager"] || "Unknown").toString().trim(), p = (e["Process"] || "").toString().trim();
      (map[m] = map[m] || { n: 0, p: {} }).n++; if (p) map[m].p[p] = (map[m].p[p] || 0) + 1;
    });
    return Object.entries(map).sort((a, b) => b[1].n - a[1].n).map(([name, d], i) =>
      '<div class="sidebar-mgr-card"><div class="sidebar-mgr-avatar" style="background:' + colors[i % colors.length] + '">' + _esc(initials(name)) + '</div>' +
      '<div class="sidebar-mgr-info"><div class="sidebar-mgr-name">' + _esc(name) + '</div><div class="sidebar-mgr-tags">' +
      Object.entries(d.p).map(([p, c]) => '<span class="sidebar-mgr-tag">' + _esc(p) + ' <strong>' + c + '</strong></span>').join("") +
      '</div></div><div class="sidebar-mgr-count">' + d.n + '</div></div>').join("");
  }
  container.innerHTML =
    '<div class="sidebar-total"><span class="sidebar-total-label">Today\'s Entries</span><span class="sidebar-total-num">' + todayE.length + '</span></div>' +
    (todayE.length ? cards(todayE) : '<div class="sidebar-empty">No admissions recorded for today yet.</div>') +
    '<div class="sidebar-total" style="background:linear-gradient(135deg,#3d4f6e,#2d3c55);margin-top:14px;"><span class="sidebar-total-label">Yesterday\'s Entries</span><span class="sidebar-total-num">' + yestE.length + '</span></div>' +
    (yestE.length ? cards(yestE) : '<div class="sidebar-empty">No admissions recorded for yesterday.</div>') +
    '<div style="text-align:center;font-size:10px;color:var(--text-light);margin-top:14px;padding-top:10px;border-top:1px solid var(--border);">Updated at ' + timeStr + '</div>';
}

// ════════════════════════════════════════════════════════════
//  DASHBOARD
// ════════════════════════════════════════════════════════════
const dashFilterProcess    = document.getElementById("filterProcess");
const dashFilterCampus     = document.getElementById("filterCampus");
const dashFilterManager    = document.getElementById("filterManager");
const dashFilterStatus     = document.getElementById("filterStatus");
const dashFilterTeamLeader = document.getElementById("filterTeamLeader");
const dashFilterCounsellor = document.getElementById("filterCounsellor");
const ALL_FILTERS = [dashFilterProcess, dashFilterCampus, dashFilterManager, dashFilterStatus, dashFilterTeamLeader, dashFilterCounsellor];

const TABLE_COLUMNS = ["Process","Admission Done date","Application Number","Candidate Name","Contact Number","Campus","Course Selected","Admission Done/Cancelled","Counsellor Name","Manager","Team Leader","Source","Student Batch","Admission Status"];

let allMeta = [];          // lowercase search/filter data, aligned with allEntries
let filteredIdx = [];      // indices (into allEntries) that pass the current filters
let curPage = 1, pageSize = 100;
let activeStatFilter = null;   // null | "active" | "cancelled"
let activeDateFrom = null, activeDateTo = null;

function _dashSkeleton() {
  dashLoading.style.display = ""; dashEmpty.style.display = "none";
  tableHead.innerHTML = ""; tableBody.innerHTML = ""; dashStats.innerHTML = "";
  const p = document.getElementById("dashPager"); if (p) p.innerHTML = "";
  const n = document.getElementById("dashLoadingNote"); if (n) n.textContent = "Loading admissions…";
}

async function loadDashboard(forceRefresh = false) {
  const titleEl = document.querySelector(".dash-title");
  if (titleEl) titleEl.innerHTML = loggedInRole === "admin"
    ? 'All Admissions <span class="mgr-badge">ADMIN</span>'
    : 'My Admissions <span class="mgr-badge">' + _esc(loggedInRole) + '</span>';

  if (forceRefresh) { _bustAll(); _forceFresh = true; toast("Refreshing data…"); _dashSkeleton(); }

  const cached = (_mem && _mem.data) || _lsGet();
  if (cached && cached.length && !forceRefresh) {
    if (!_mem) _mem = { data: cached, ver: _lsVer(), ts: Date.now() };
    dashLoading.style.display = "none"; dashEmpty.style.display = "none";
    _applyDash(cached);
    if (!_mem.ver || Date.now() - _mem.ts > 15000) {
      _refresh().then(r => { if (r && r.changed) _applyDash(r.data); });
    }
    return;
  }
  if (!forceRefresh) _dashSkeleton();

  const data = await _get();
  dashLoading.style.display = "none";
  if (data && data.length) { _applyDash(data); }
  else if (data)           { dashEmpty.style.display = ""; }
  else { dashEmpty.style.display = ""; toast("Could not load data — please try refreshing", "error"); }
}

function _meta(rows) {
  return rows.map(r => {
    let s = "";
    for (const k in r) { const v = r[k]; if (v) s += String(v).toLowerCase() + "\u0001"; }
    return { d: _rowDate(r), s: s, c: _lc(r["Admission Status"]) === "cancelled",
      p: _lc(r["Process"]), ca: _lc(r["Campus"]), m: _lc(r["Manager"]),
      st: _lc(r["Admission Done/Cancelled"]), t: _lc(r["Team Leader"]), co: _lc(r["Counsellor Name"]) };
  });
}

function _applyDash(raw) {
  const data = loggedInRole && loggedInRole !== "admin"
    ? raw.filter(e => (e["Manager"] || "").trim() === loggedInRole)
    : raw;
  allEntries = data;
  allMeta = _meta(data);
  populateFilters(data);
  let c = 0; for (let i = 0; i < allMeta.length; i++) if (allMeta[i].c) c++;
  renderStats(data.length, c);
  applyFilters(true);                  // keeps current page, filters, search, dates
  dashEmpty.style.display = data.length ? "none" : "";
}

function _fillSelect(sel, allLabel, values) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">' + allLabel + '</option>' +
    values.map(v => '<option value="' + _esc(v) + '">' + _esc(v) + '</option>').join("");
  if (cur && values.includes(cur)) sel.value = cur;
}
function populateFilters(entries) {
  const defs = [["Process", dashFilterProcess, "All Processes"], ["Campus", dashFilterCampus, "All Campuses"],
    ["Manager", dashFilterManager, "All Managers"], ["Admission Done/Cancelled", dashFilterStatus, "All Status"],
    ["Team Leader", dashFilterTeamLeader, "All Team Leaders"], ["Counsellor Name", dashFilterCounsellor, "All Counsellors"]];
  const sets = defs.map(() => new Set());
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    for (let k = 0; k < defs.length; k++) { const v = (e[defs[k][0]] || "").toString().trim(); if (v) sets[k].add(v); }
  }
  defs.forEach((d, k) => _fillSelect(d[1], d[2], [...sets[k]].sort((a, b) => a.localeCompare(b))));
}

// ════════════════════════════════════════════════════════════
//  FILTERING (index-based, no per-keystroke string building)
// ════════════════════════════════════════════════════════════
function applyFilters(keepPage) {
  const q = searchBox.value.trim().toLowerCase();
  const proc = _lc(dashFilterProcess.value), campus = _lc(dashFilterCampus.value),
        mgr = _lc(dashFilterManager.value), status = _lc(dashFilterStatus.value),
        tl = _lc(dashFilterTeamLeader.value), cs = _lc(dashFilterCounsellor.value);
  const dF = activeDateFrom, dT = activeDateTo;
  const base = []; let cancelled = 0;
  for (let i = 0; i < allMeta.length; i++) {
    const m = allMeta[i];
    if (proc && m.p !== proc) continue;
    if (campus && m.ca !== campus) continue;
    if (mgr && m.m !== mgr) continue;
    if (status && m.st !== status) continue;
    if (tl && m.t !== tl) continue;
    if (cs && m.co !== cs) continue;
    if (dF || dT) { if (!m.d) continue; if (dF && m.d < dF) continue; if (dT && m.d > dT) continue; }
    if (q && m.s.indexOf(q) === -1) continue;
    base.push(i); if (m.c) cancelled++;
  }
  updateStatCounts(base.length, cancelled);
  let shown = base;
  if (activeStatFilter === "active")         shown = base.filter(i => !allMeta[i].c);
  else if (activeStatFilter === "cancelled") shown = base.filter(i => allMeta[i].c);
  filteredIdx = shown;
  if (keepPage !== true) curPage = 1;
  renderPage();
}

function clearFilters() {
  searchBox.value = "";
  ALL_FILTERS.forEach(s => s.value = "");
  activeStatFilter = null; activeDateFrom = activeDateTo = null;
  const f = document.getElementById("dateFrom"), t = document.getElementById("dateTo");
  if (f) f.value = ""; if (t) t.value = "";
  document.querySelectorAll(".date-preset-btn").forEach(b => b.classList.remove("active"));
  const pp = document.getElementById("datePickerPopup"); if (pp) pp.classList.remove("open");
  document.querySelectorAll(".stat-card").forEach(c => c.classList.remove("stat-active-filter"));
  updateDateFilterLabel();
  applyFilters(false);
}

let _searchDebounce = null;
searchBox.addEventListener("input", () => { clearTimeout(_searchDebounce); _searchDebounce = setTimeout(() => applyFilters(false), 180); });
ALL_FILTERS.forEach(s => s.addEventListener("change", () => applyFilters(false)));

// ── Date range filter ──
function toggleDatePicker() {
  const panel = document.getElementById("datePickerPopup"), btn = document.getElementById("dateFilterBtn");
  const open = panel.classList.toggle("open");
  btn.classList.toggle("active", open || !!(activeDateFrom || activeDateTo));
}
function applyDatePreset(preset, ev) {
  document.querySelectorAll(".date-preset-btn").forEach(b => b.classList.remove("active"));
  const src = (ev && ev.target) || (window.event && window.event.target); if (src && src.classList) src.classList.add("active");
  const t = new Date(); let from, to = localDateStr(t);
  if (preset === "today") from = to;
  else if (preset === "yesterday") { const y = new Date(t); y.setDate(t.getDate() - 1); from = to = localDateStr(y); }
  else if (preset === "week") { const w = new Date(t); w.setDate(t.getDate() - (t.getDay() === 0 ? 6 : t.getDay() - 1)); from = localDateStr(w); }
  else if (preset === "month") from = localDateStr(new Date(t.getFullYear(), t.getMonth(), 1));
  else if (preset === "last30") { const l = new Date(t); l.setDate(t.getDate() - 29); from = localDateStr(l); }
  document.getElementById("dateFrom").value = from;
  document.getElementById("dateTo").value = to;
}
function onDateChange() { document.querySelectorAll(".date-preset-btn").forEach(b => b.classList.remove("active")); }
function applyDateFilter() {
  activeDateFrom = document.getElementById("dateFrom").value || null;
  activeDateTo   = document.getElementById("dateTo").value   || null;
  document.getElementById("datePickerPopup").classList.remove("open");
  updateDateFilterLabel();
  applyFilters(false);
}
function clearDateFilter() {
  activeDateFrom = activeDateTo = null;
  document.getElementById("dateFrom").value = ""; document.getElementById("dateTo").value = "";
  document.querySelectorAll(".date-preset-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("datePickerPopup").classList.remove("open");
  updateDateFilterLabel();
  applyFilters(false);
}
function updateDateFilterLabel() {
  const btn = document.getElementById("dateFilterBtn"), label = document.getElementById("dateFilterLabel");
  if (activeDateFrom || activeDateTo) {
    const f = s => { if (!s) return "?"; const [y, m, d] = s.split("-"); return d + "/" + m + "/" + y; };
    label.textContent = activeDateFrom === activeDateTo ? f(activeDateFrom) : f(activeDateFrom) + " – " + f(activeDateTo);
    btn.classList.add("active");
  } else { label.textContent = "All Dates"; btn.classList.remove("active"); }
}

// ════════════════════════════════════════════════════════════
//  STAT CARDS
// ════════════════════════════════════════════════════════════
function renderStats(total, cancelled) {
  const net = total - cancelled;
  const cls = k => activeStatFilter === k ? " stat-active-filter" : "";
  dashStats.innerHTML =
    '<div class="stat-card" onclick="applyStatFilter(\'all\')" title="Show all">' +
      '<div class="stat-card-icon" style="background:#eef2fb;">📋</div><div class="stat-card-body"><div class="stat-num" id="statTotal">' + total + '</div><div class="stat-label">Total</div></div></div>' +
    '<div class="stat-card stat-green' + cls("active") + '" onclick="applyStatFilter(\'active\')" title="Active only">' +
      '<div class="stat-card-icon" style="background:var(--emerald-light);">✅</div><div class="stat-card-body"><div class="stat-num" id="statNet" style="color:var(--emerald)">' + net + '</div><div class="stat-label">Net Admissions</div></div></div>' +
    '<div class="stat-card stat-red' + cls("cancelled") + '" onclick="applyStatFilter(\'cancelled\')" title="Cancelled only">' +
      '<div class="stat-card-icon" style="background:var(--ruby-light);">❌</div><div class="stat-card-body"><div class="stat-num" id="statCancelled" style="color:var(--ruby)">' + cancelled + '</div><div class="stat-label">Cancelled</div></div></div>';
}
function animateCount(el, from, to) {
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 250;
  (function step(now) {
    const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step); else el.textContent = to;
  })(t0);
}
function updateStatCounts(total, cancelled) {
  const set = (id, v) => { const el = document.getElementById(id); if (el) animateCount(el, parseInt(el.textContent) || 0, v); };
  set("statTotal", total); set("statNet", total - cancelled); set("statCancelled", cancelled);
  const filtered = total !== allEntries.length;
  document.querySelectorAll(".stat-card").forEach(c => c.classList.toggle("stat-is-filtered", filtered));
}
function applyStatFilter(type) {
  activeStatFilter = (type === "all" || activeStatFilter === type) ? null : type;
  document.querySelectorAll(".stat-card").forEach((c, i) => {
    const key = [null, "active", "cancelled"][i];
    c.classList.toggle("stat-active-filter", activeStatFilter !== null && activeStatFilter === key);
  });
  applyFilters(false);
}

// ════════════════════════════════════════════════════════════
//  TABLE — paginated (only one page of rows ever exists in the DOM)
// ════════════════════════════════════════════════════════════
function _cell(col, r, m) {
  const v = r[col] == null ? "" : String(r[col]);
  if (col === "Admission Done/Cancelled") {
    const l = v.trim().toLowerCase(), c = l === "done" ? "status-done" : l === "cancelled" ? "status-cancelled" : "status-pending";
    return '<td><span class="status-badge ' + c + '">' + _esc(v) + '</span></td>';
  }
  if (col === "Admission Status") return '<td><span class="status-badge ' + (m.c ? "status-cancelled" : "status-active") + '">' + _esc(v || "Active") + '</span></td>';
  if (col === "Admission Done date") {
    if (m.d) { const p = m.d.split("-"); return '<td>' + p[2] + "-" + (_MON[+p[1] - 1] || p[1]) + "-" + p[0] + '</td>'; }
    return '<td>' + _esc(v) + '</td>';
  }
  return '<td' + (v.length > 24 ? ' title="' + _esc(v) + '"' : "") + '>' + _esc(v) + '</td>';
}
function _rowHTML(i, showAction) {
  const r = allEntries[i], m = allMeta[i];
  let h = '<tr' + (m.c ? ' class="row-cancelled"' : "") + '>';
  if (showAction) {
    h += '<td style="white-space:nowrap"><button class="' + (m.c ? "btn-reactivate" : "btn-cancel-admission") +
      '" data-i="' + i + '" data-act="' + (m.c ? "re" : "ca") + '">' + (m.c ? "Reactivate" : "Cancel") + '</button></td>';
  }
  for (let k = 0; k < TABLE_COLUMNS.length; k++) h += _cell(TABLE_COLUMNS[k], r, m);
  return h + "</tr>";
}

function renderPage() {
  const showAction = loggedInRole !== "";
  const headerCols = showAction ? ["Action", ...TABLE_COLUMNS] : TABLE_COLUMNS;
  tableHead.innerHTML = "<tr>" + headerCols.map(c => "<th>" + c + "</th>").join("") + "</tr>";
  const total = filteredIdx.length, pages = Math.max(1, Math.ceil(total / pageSize));
  if (curPage > pages) curPage = pages; if (curPage < 1) curPage = 1;
  if (!total) {
    tableBody.innerHTML = '<tr><td colspan="' + headerCols.length + '" style="text-align:center;padding:30px;color:var(--text-muted)">No matching entries</td></tr>';
    renderPager(0, 0, 0, 1); return;
  }
  const start = (curPage - 1) * pageSize, end = Math.min(start + pageSize, total);
  let html = "";
  for (let k = start; k < end; k++) html += _rowHTML(filteredIdx[k], showAction);
  tableBody.innerHTML = html;
  renderPager(start, end, total, pages);
}

function ensurePager() {
  let p = document.getElementById("dashPager");
  if (p) return p;
  p = document.createElement("div"); p.id = "dashPager"; p.className = "pager";
  const w = document.querySelector(".table-wrap");
  w.parentNode.insertBefore(p, w.nextSibling);
  p.addEventListener("click", e => {
    const b = e.target.closest("button[data-p]"); if (!b || b.disabled) return;
    curPage += b.dataset.p === "next" ? 1 : -1;
    renderPage();
    w.scrollTop = 0;
  });
  p.addEventListener("change", e => {
    if (e.target.id === "pageSizeSel") { pageSize = +e.target.value; curPage = 1; renderPage(); w.scrollTop = 0; }
  });
  return p;
}
function renderPager(start, end, total, pages) {
  const p = ensurePager();
  const sync = _lastSync ? " · Updated " + new Date(_lastSync).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
  p.innerHTML =
    '<span>' + (total ? "Showing " + (start + 1).toLocaleString() + "–" + end.toLocaleString() + " of " + total.toLocaleString() : "No results") + sync + '</span>' +
    '<div class="pager-btns"><button data-p="prev"' + (curPage <= 1 ? " disabled" : "") + '>‹ Prev</button>' +
    '<span>Page ' + curPage + ' / ' + pages + '</span>' +
    '<button data-p="next"' + (curPage >= pages ? " disabled" : "") + '>Next ›</button>' +
    '<select id="pageSizeSel" title="Rows per page">' +
    [50, 100, 200, 500].map(n => '<option value="' + n + '"' + (n === pageSize ? " selected" : "") + '>' + n + ' / page</option>').join("") +
    '</select></div>';
}

// One delegated click handler for all Cancel / Reactivate buttons
tableBody.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const row = allEntries[+b.dataset.i]; if (!row) return;
  const app = (row["Application Number"] || "").toString();
  if (b.dataset.act === "ca") cancelAdmission(app, b, row); else reactivateAdmission(app, b, row);
});

// ════════════════════════════════════════════════════════════
//  CANCEL / REACTIVATE — updates the screen instantly, no full reload
// ════════════════════════════════════════════════════════════
async function _postAction(payload, btn, busyText, restoreText) {
  if (btn) { btn.disabled = true; btn.textContent = busyText; }
  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    const json = JSON.parse(await res.text());
    if (json.status === "success") return true;
    toast("❌ " + (json.message || "Action failed"), "error");
  } catch (e) { toast("⚠ Network error — please try again", "error"); }
  if (btn) { btn.disabled = false; btn.textContent = restoreText; }
  return false;
}
function _patchStatus(row, appNum, status) {
  let r = row;
  if (!r) r = allEntries.find(e => _lc(e["Application Number"]) === _lc(appNum));
  if (r) r["Admission Status"] = status;
  allMeta = _meta(allEntries);
  applyFilters(true);
  if (_mem) _lsSet(_mem);
}
function _syncSoon() {
  _refresh().then(r => { if (r && r.changed && dashboardCard.style.display !== "none") _applyDash(r.data); });
}
async function cancelAdmission(appNum, btn, row) {
  if (!confirm("Cancel admission for Application Number: " + appNum + "?")) return;
  if (await _postAction({ action: "cancelAdmission", appNumber: appNum.trim(), cancelledBy: loggedInRole }, btn, "Cancelling…", "Cancel")) {
    toast("✅ Admission cancelled", "success"); _patchStatus(row, appNum, "Cancelled"); _syncSoon();
  }
}
async function reactivateAdmission(appNum, btn, row) {
  if (!confirm("Reactivate admission for Application Number: " + appNum + "?")) return;
  if (await _postAction({ action: "reactivateAdmission", appNumber: appNum.trim(), reactivatedBy: loggedInRole }, btn, "Reactivating…", "Reactivate")) {
    toast("✅ Admission reactivated", "success"); _patchStatus(row, appNum, "Active"); _syncSoon();
  }
}

</script>

<script>
const log = (msg, cls) => {
  const d = document.createElement("div");
  d.className = cls || "";
  d.textContent = msg;
  document.getElementById("log").appendChild(d);
};

document.getElementById("go").onclick = async () => {
  document.getElementById("log").innerHTML = "";
  const f = document.getElementById("file").files[0];
  const url = document.getElementById("url").value.trim();
  if (!f) return log("Please choose your HTML file first.", "err");
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url))
    return log("The URL must look like https://script.google.com/macros/s/.../exec", "err");

  let html = await f.text();

  // 1. API URL
  if (/const API_URL = "[^"]*";/.test(html)) {
    html = html.replace(/const API_URL = "[^"]*";/, 'const API_URL = "' + url + '";');
    log("✓ API_URL updated", "ok");
  } else log("✗ Could not find the API_URL line", "err");

  // 2. Orphan CSS lines in the first searchable-dropdown block
  const orphan = /\n[ \t]*box-shadow: 0 0 0 3px rgba\(26,54,93,0\.1\);\s*background: #fff;\s*cursor: text;\s*\}/;
  if (orphan.test(html)) { html = html.replace(orphan, ""); log("✓ Removed broken CSS fragment", "ok"); }
  else log("• Broken CSS fragment not present (already fixed)", "warn");

  // 3. Missing </head>
  if (!/<\/head>/i.test(html)) {
    html = html.replace(/<\/style>\s*<body>/i, "</style>\n</head>\n<body>");
    log("✓ Added missing </head>", "ok");
  } else log("• </head> already present", "warn");

  // 4. Skeleton CSS for the stat boxes
  if (!/\.skel-num\s*\{/.test(html)) {
    html = html.replace("</style>", "  .skel-num   { height: 22px; width: 60px; margin-bottom: 8px; }\n  .skel-label { height: 10px; width: 90px; }\n</style>");
    log("✓ Added loading-skeleton styles", "ok");
  } else log("• Skeleton styles already present", "warn");

  // 5. Raw template code left inside the static dashLoading block
  if (/\$\{\[90,110/.test(html)) {
    const row = '<span class="skeleton skel-row" style="width:100%;height:14px;"></span>';
    html = html.replace(/<!-- Table rows skeleton -->\s*<div style="border:1px solid #e8e4dc[\s\S]*?<\/div>\s*<\/div>\s*<\/div>\s*(?=<\/div>\s*<\/main>)/,
      '<div style="border:1px solid #e8e4dc;border-radius:8px;padding:12px;">' + row + row + row + row + '</div>\n    </div>\n  ');
    log("✓ Replaced broken loading skeleton", "ok");
  } else log("• Loading skeleton already clean", "warn");

  // 6. Source + Student Batch fields
  if (!/name="Source"/.test(html)) {
    const fields =
'        <div class="field">\n' +
'          <label>Source <span class="req">*</span></label>\n' +
'          <input type="text" name="Source" placeholder="e.g. Alliance_G" required>\n' +
'          <div class="field-error">Source is required</div>\n' +
'        </div>\n\n' +
'        <div class="field">\n' +
'          <label>Student Batch <span class="req">*</span></label>\n' +
'          <input type="text" name="Student Batch" placeholder="e.g. 2026" required>\n' +
'          <div class="field-error">Student batch is required</div>\n' +
'        </div>\n\n';
    if (/<div class="btn-row">/.test(html)) {
      html = html.replace('<div class="btn-row">', fields + '        <div class="btn-row">');
      log("✓ Added Source and Student Batch fields to the form", "ok");
    } else log("✗ Could not find the place to add the new fields", "err");
  } else log("• Source / Student Batch fields already present", "warn");

  // 7. Show the new columns in the dashboard table
  if (!/"Source","Student Batch"/.test(html)) {
    if (/"Team Leader","Admission Status"\]/.test(html)) {
      html = html.replace('"Team Leader","Admission Status"]', '"Team Leader","Source","Student Batch","Admission Status"]');
      log("✓ Added Source and Student Batch columns to the dashboard table", "ok");
    } else log("✗ Could not find TABLE_COLUMNS", "err");
  } else log("• Dashboard columns already include the new fields", "warn");

  // 8. Non-blocking Google Fonts (page paints immediately instead of waiting for fonts)
  const fontRe = /<link href="(https:\/\/fonts\.googleapis\.com\/css2\?[^"]+)" rel="stylesheet">/;
  if (!/rel="preload" as="style"/.test(html) && fontRe.test(html)) {
    html = html.replace(fontRe, function (m, href) {
      return '<link rel="preload" as="style" href="' + href + '" onload="this.onload=null;this.rel=\'stylesheet\'">\n' +
             '<noscript><link rel="stylesheet" href="' + href + '"></noscript>';
    });
    log("✓ Fonts now load without blocking the page", "ok");
  } else log("• Fonts already non-blocking (or not found)", "warn");

  // 9. Optimized data layer, filtering, pagination and sidebar
  if (/HS-PERF-v2/.test(html)) {
    log("• Performance upgrade already applied", "warn");
  } else {
    const perf = document.getElementById("perfBlock").textContent.trim() + "\n\n";
    const a = html.indexOf("PERFORMANCE: In-memory cache");
    const b = html.indexOf("SEARCHABLE COURSE DROPDOWNS");
    if (a === -1 || b === -1 || b < a) {
      log("✗ Could not find the data/dashboard section to upgrade. Use the original file from the earlier fixer run.", "err");
    } else {
      const start = html.lastIndexOf("\n", a) + 1;
      const end = html.lastIndexOf("// ═", b);
      html = html.slice(0, start) + perf + html.slice(end);
      log("✓ Performance upgrade applied (cached data, fast search, paginated table, instant cancel/reactivate)", "ok");
    }
  }

  // Download
  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  log("\nDone. Saved as index.html in your downloads.", "ok");
};
</script>
